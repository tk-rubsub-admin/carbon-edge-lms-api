databaseChangeLog:
  - changeSet:
      id: 010-create-course-student-enrollments-table
      author: codex
      changes:
        - createTable:
            tableName: course_student_enrollments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_course_student_enrollments_user
                    references: users(id)
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: course_student_enrollments
            columnNames: user_id, course_id
            constraintName: uq_course_student_enrollments_user_course
