databaseChangeLog:
  - changeSet:
      id: 013-create-course-templates-table
      author: codex
      changes:
        - createTable:
            tableName: course_templates
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(2000)
              - column:
                  name: template_type
                  type: VARCHAR(40)
                  constraints:
                    nullable: false
              - column:
                  name: source_course_id
                  type: BIGINT
              - column:
                  name: category_id_default
                  type: INT
              - column:
                  name: visible_default
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: definition_json
                  type: CLOB
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
