databaseChangeLog:
  - changeSet:
      id: 014-create-course-content-progress-table
      author: codex
      changes:
        - createTable:
            tableName: course_content_progress
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_course_content_progress_user
                    references: users(id)
              - column:
                  name: course_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: content_item_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_course_content_progress_item
                    references: course_content_items(id)
              - column:
                  name: started_at
                  type: TIMESTAMP
              - column:
                  name: completed_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: course_content_progress
            columnNames: user_id, content_item_id
            constraintName: uk_course_content_progress_user_item
        - createIndex:
            tableName: course_content_progress
            indexName: idx_course_content_progress_course_user
            columns:
              - column:
                  name: course_id
              - column:
                  name: user_id
