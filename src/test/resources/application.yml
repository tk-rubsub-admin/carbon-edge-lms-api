spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  mail:
    host: localhost
    port: 2525
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  frontend-base-url: http://localhost:4000
  public-base-url: http://localhost:8086/lms-api
  content-storage-path: ./target/test-course-content
  bot-protection:
    enabled: false

moodle:
  integration:
    mode: mock
    base-url: http://moodle.test
    login-base-url: http://moodle.test
    login-service: moodle_mobile_app
    launch-shared-secret: test-shared-secret
    launch-token-ttl-seconds: 60
    launch-plugin-path: /local/lmslaunch/launch.php
